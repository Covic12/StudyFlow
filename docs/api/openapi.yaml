openapi: 3.0.3
info:
  title: StudyFlow API
  version: 1.0.0
  description: REST API for StudyFlow academic management and Open Library learning-resource search.
servers:
  - url: http://localhost:8000
    description: Local development server with backend as document root
paths:
  /api/health:
    get:
      summary: API health check
      responses:
        '200': {description: API is running}
  /api/v1/users:
    get: &listOperation
      summary: List users
      responses:
        '200': {description: Collection returned}
        '500': {$ref: '#/components/responses/ServerError'}
    post: &createOperation
      summary: Create user
      requestBody: &jsonBody
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenericObject'}
      responses:
        '201': {description: Created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/users/{id}:
    parameters: [&idParameter {$ref: '#/components/parameters/id'}]
    get: &getOperation
      summary: Get users record
      responses:
        '200': {description: Record returned}
        '404': {$ref: '#/components/responses/NotFound'}
    put: &updateOperation
      summary: Replace/update users record
      requestBody: *jsonBody
      responses:
        '200': {description: Updated}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch: *updateOperation
    delete: &deleteOperation
      summary: Delete users record
      responses:
        '200': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/courses:
    get: *listOperation
    post: *createOperation
  /api/v1/courses/{id}:
    parameters: [*idParameter]
    get: *getOperation
    put: *updateOperation
    patch: *updateOperation
    delete: *deleteOperation
  /api/v1/assignments:
    get: *listOperation
    post: *createOperation
  /api/v1/assignments/{id}:
    parameters: [*idParameter]
    get: *getOperation
    put: *updateOperation
    patch: *updateOperation
    delete: *deleteOperation
  /api/v1/study-sessions:
    get: *listOperation
    post: *createOperation
  /api/v1/study-sessions/{id}:
    parameters: [*idParameter]
    get: *getOperation
    put: *updateOperation
    patch: *updateOperation
    delete: *deleteOperation
  /api/v1/notes:
    get: *listOperation
    post: *createOperation
  /api/v1/notes/{id}:
    parameters: [*idParameter]
    get: *getOperation
    put: *updateOperation
    patch: *updateOperation
    delete: *deleteOperation
  /api/v1/categories:
    get: *listOperation
    post: *createOperation
  /api/v1/categories/{id}:
    parameters: [*idParameter]
    get: *getOperation
    put: *updateOperation
    patch: *updateOperation
    delete: *deleteOperation
  /api/v1/resources/search:
    get:
      summary: Search Open Library books
      parameters:
        - in: query
          name: q
          required: true
          schema: {type: string, minLength: 1, maxLength: 120}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 20, default: 10}
      responses:
        '200': {description: Search results returned}
        '400': {$ref: '#/components/responses/BadRequest'}
        '502': {description: External API unavailable}
components:
  parameters:
    id:
      in: path
      name: id
      required: true
      schema: {type: integer, minimum: 1}
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    Error:
      type: object
      properties:
        error: {type: string}
        message: {type: string}
  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
